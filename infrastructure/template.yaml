AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HeatFlood Guardian — SAM template (Day 3)

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures: [arm64]
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        INCIDENTS_TABLE: !Ref IncidentsTable
        HOTSPOTS_TABLE: !Ref HotspotsTable

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  MapboxToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Mapbox Secret Token for Directions API
  SageMakerEndpointName:
    Type: String
    Default: ''
    Description: Optional SageMaker endpoint; leave empty to keep ML disabled

Conditions:
  HasSageMakerEndpoint:
    Fn::Not:
      - Fn::Equals:
          - Ref: SageMakerEndpointName
          - ''

Resources:

  # ------------------------------------------------------------------ #
  # DynamoDB Tables
  # ------------------------------------------------------------------ #

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'heatflood-incidents-${Stage}'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttlEpoch
        Enabled: true
      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S
        - AttributeName: geohash
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: geohash-createdAt-index
          KeySchema:
            - AttributeName: geohash
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  HotspotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'heatflood-hotspots-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hotspotId
          AttributeType: S
      KeySchema:
        - AttributeName: hotspotId
          KeyType: HASH

  # ------------------------------------------------------------------ #
  # Lambda Functions
  # ------------------------------------------------------------------ #

  AnalyseRoutesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-analyseRoutes-${Stage}'
      Handler: dist/analyseRoutes.handler
      CodeUri: ../lambda
      Environment:
        Variables:
          MAPBOX_TOKEN: !Ref MapboxToken
          SAGEMAKER_ENABLED: !If [HasSageMakerEndpoint, 'true', 'false']
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
          ML_MODEL_VERSION: 'xgb-rainfall-stress-v1'
          ML_TIMEOUT_MS: '800'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HotspotsTable
        - Statement:
            Effect: Allow
            Action: sagemaker:InvokeEndpoint
            Resource: !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/${SageMakerEndpointName}'
            Condition:
              StringNotEquals:
                aws:ResourceTag/heatflood-ml: 'disabled'
        - SSMParameterReadPolicy:
            ParameterName: /heatflood/mapbox-token
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /routes/analyse
            Method: POST

  GetStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-getStatus-${Stage}'
      Handler: dist/getStatus.handler
      CodeUri: ../lambda
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HotspotsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /status
            Method: GET

  CreateIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-createIncident-${Stage}'
      Handler: dist/createIncident.handler
      CodeUri: ../lambda
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: POST

  ListIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-listIncidents-${Stage}'
      Handler: dist/listIncidents.handler
      CodeUri: ../lambda
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: GET

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-health-${Stage}'
      Handler: dist/health.handler
      CodeUri: ../lambda
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  GetDemoScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-getDemoScenario-${Stage}'
      Handler: dist/getDemoScenario.handler
      CodeUri: ../lambda
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /demo/scenarios/{id}
            Method: GET

  # ------------------------------------------------------------------ #
  # API Gateway
  # ------------------------------------------------------------------ #

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub 'heatflood-api-${Stage}'
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Request-Id

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  IncidentsTableName:
    Value: !Ref IncidentsTable
  HotspotsTableName:
    Value: !Ref HotspotsTable
