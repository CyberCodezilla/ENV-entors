AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HeatFlood Guardian — SAM template with Security & DevOps Enhancements

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        INCIDENTS_TABLE: !Ref IncidentsTable
        HOTSPOTS_TABLE: !Ref HotspotsTable

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  MapboxToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Mapbox Secret Token for Directions API
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: '*'
    Description: Allowed origins for API Gateway CORS configuration
  SageMakerEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable or disable AWS SageMaker ML inference endpoint integration
  SageMakerEndpointName:
    Type: String
    Default: 'heatflood-xgb-v2'
    Description: Name of the active AWS SageMaker inference endpoint

Resources:

  # ------------------------------------------------------------------ #
  # DynamoDB Tables
  # ------------------------------------------------------------------ #

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'heatflood-incidents-${Stage}'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttlEpoch
        Enabled: true
      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S
        - AttributeName: geohash
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: geohash-createdAt-index
          KeySchema:
            - AttributeName: geohash
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  HotspotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'heatflood-hotspots-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hotspotId
          AttributeType: S
      KeySchema:
        - AttributeName: hotspotId
          KeyType: HASH

  ScenarioRunsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'heatflood-scenario-runs-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runId
          AttributeType: S
        - AttributeName: partitionKey
          AttributeType: S
        - AttributeName: generatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: runId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: partitionKey-generatedAt-index
          KeySchema:
            - AttributeName: partitionKey
              KeyType: HASH
            - AttributeName: generatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttlEpoch
        Enabled: true

  ScenarioEventsBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'heatflood-scenario-events-${Stage}'

  # ------------------------------------------------------------------ #
  # Cognito Auth & RBAC
  # ------------------------------------------------------------------ #

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'heatflood-user-pool-${Stage}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'heatflood-client-${Stage}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  ModeratorUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Moderators
      Description: Administrative group for incident moderation and verification
      UserPoolId: !Ref UserPool

  # ------------------------------------------------------------------ #
  # AWS WAF Rate-Limiting Protection
  # ------------------------------------------------------------------ #

  ApiWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'heatflood-webacl-${Stage}'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: HeatFloodWebACL
      Rules:
        - Name: IPBasedRateLimitRule
          Priority: 1
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: IPBasedRateLimitRule
          Statement:
            RateBasedStatement:
              Limit: 300
              AggregateKeyType: IP

  # ------------------------------------------------------------------ #
  # Secrets Manager & Dynamic References
  # ------------------------------------------------------------------ #

  MapboxSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'heatflood/mapbox-token-${Stage}'
      Description: Centralized Mapbox API token with Secrets Manager dynamic rotation
      SecretString: !Sub '{"token":"${MapboxToken}"}'

  # ------------------------------------------------------------------ #
  # Lambda Functions
  # ------------------------------------------------------------------ #

  AnalyseRoutesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-analyseRoutes-${Stage}'
      Handler: analyseRoutes.handler
      CodeUri: ../lambda/dist
      Environment:
        Variables:
          SAGEMAKER_ENABLED: !Ref SageMakerEnabled
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
          MAPBOX_TOKEN: '{{resolve:ssm:/heatflood/mapbox-token}}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HotspotsTable
        - SSMParameterReadPolicy:
            ParameterName: /heatflood/mapbox-token
        - Statement:
            - Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
              Resource: !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /routes/analyse
            Method: POST

  GetStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-getStatus-${Stage}'
      Handler: getStatus.handler
      CodeUri: ../lambda/dist
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HotspotsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /status
            Method: GET

  IncidentReportsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'heatflood-incident-dlq-${Stage}'
      MessageRetentionPeriod: 1209600

  IncidentReportsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'heatflood-incident-queue-${Stage}'
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IncidentReportsDLQ.Arn
        maxReceiveCount: 5

  CreateIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-createIncident-${Stage}'
      Handler: createIncident.handler
      CodeUri: ../lambda/dist
      Environment:
        Variables:
          INCIDENT_QUEUE_URL: !Ref IncidentReportsQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IncidentReportsQueue.QueueName
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: POST

  IncidentWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-incidentWorker-${Stage}'
      Handler: incidentWorker.handler
      CodeUri: ../lambda/dist
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt IncidentReportsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ListIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-listIncidents-${Stage}'
      Handler: listIncidents.handler
      CodeUri: ../lambda/dist
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: GET

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-health-${Stage}'
      Handler: health.handler
      CodeUri: ../lambda/dist
      Environment:
        Variables:
          SAGEMAKER_ENABLED: !Ref SageMakerEnabled
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  GetDemoScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-getDemoScenario-${Stage}'
      Handler: getDemoScenario.handler
      CodeUri: ../lambda/dist
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /demo/scenarios/{id}
            Method: GET

  InnovationScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-innovationScenario-${Stage}'
      Handler: innovationScenario.handler
      CodeUri: ../lambda/dist
      Timeout: 20
      Environment:
        Variables:
          SCENARIO_RUNS_TABLE: !Ref ScenarioRunsTable
          SCENARIO_EVENT_BUS_ARN: !GetAtt ScenarioEventsBus.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScenarioRunsTable
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt ScenarioEventsBus.Arn
      Events:
        RunScenario:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /scenarios/run
            Method: POST
        ScenarioHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /scenarios/history
            Method: GET

  ScenarioWorkflowTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-scenarioWorkflowTask-${Stage}'
      Handler: scenarioWorkflowTask.handler
      CodeUri: ../lambda/dist
      Environment:
        Variables:
          SCENARIO_RUNS_TABLE: !Ref ScenarioRunsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScenarioRunsTable

  ScenarioWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeScenarioWorkflowTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScenarioWorkflowTaskFunction.Arn

  ScenarioStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'heatflood-scenario-workflow-${Stage}'
      StateMachineType: STANDARD
      RoleArn: !GetAtt ScenarioWorkflowRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Idempotent post-assessment scenario audit workflow",
          "StartAt": "ValidateScenarioEvent",
          "States": {
            "ValidateScenarioEvent": {
              "Type": "Choice",
              "Choices": [{ "Variable": "$.detail.simulated", "BooleanEquals": true, "Next": "RecordWorkflowCompletion" }],
              "Default": "RejectNonSimulation"
            },
            "RecordWorkflowCompletion": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": { "FunctionName": "${ScenarioWorkflowTaskFunction.Arn}", "Payload.$": "$.detail" },
              "Retry": [{ "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "States.Timeout"], "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0 }],
              "ResultPath": "$.workflowResult",
              "End": true
            },
            "RejectNonSimulation": { "Type": "Fail", "Error": "NonSimulationEvent", "Cause": "Only explicitly simulated scenarios may enter this workflow." }
          }
        }

  ScenarioEventsToWorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartScenarioWorkflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ScenarioStateMachine

  ScenarioEventsToWorkflowRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'heatflood-scenario-workflow-rule-${Stage}'
      EventBusName: !Ref ScenarioEventsBus
      EventPattern:
        source: ['heatflood.guardian']
        detail-type: ['HeatFloodScenarioAssessed']
      State: ENABLED
      Targets:
        - Id: ScenarioStateMachineTarget
          Arn: !Ref ScenarioStateMachine
          RoleArn: !GetAtt ScenarioEventsToWorkflowRole.Arn

  VerifyIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-verifyIncident-${Stage}'
      Handler: verifyIncident.handler
      CodeUri: ../lambda/dist
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}/verify
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-deleteIncident-${Stage}'
      Handler: deleteIncident.handler
      CodeUri: ../lambda/dist
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  # ------------------------------------------------------------------ #
  # API Gateway
  # ------------------------------------------------------------------ #

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub 'heatflood-api-${Stage}'
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Request-Id
          - Authorization
      Auth:
        Authorizers:
          CognitoAuthorizer:
            AuthorizationScopes:
              - openid
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  # ------------------------------------------------------------------ #
  # AWS WAF Association
  # ------------------------------------------------------------------ #

  ApiWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/${HttpApi}/stages/${Stage}'
      WebACLArn: !GetAtt ApiWebACL.Arn

  # ------------------------------------------------------------------ #
  # CloudFront CDN Distribution with HTTPS for S3 Website
  # ------------------------------------------------------------------ #

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'heatflood-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'heatflood-oac-${Stage}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: HeatFlood Frontend Distribution
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        HttpVersion: http2and3

  # ------------------------------------------------------------------ #
  # Observability & CloudWatch Alarms
  # ------------------------------------------------------------------ #

  Lambda5XXErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm if Lambda 5XX error count exceeds threshold during extreme events
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm if Lambda p95 execution latency exceeds 2.5 seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 1
      Threshold: 2500
      ComparisonOperator: GreaterThanThreshold

  WAFBlockedRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm if WAF rate-limiting rule blocks malicious flood traffic
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: Rule
          Value: IPBasedRateLimitRule
        - Name: WebACL
          Value: !Sub 'heatflood-webacl-${Stage}'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  FrontendDistributionDomainName:
    Description: CloudFront CDN Domain Name with HTTPS for Frontend S3 Bucket
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendBucketName:
    Value: !Ref FrontendBucket
  IncidentsTableName:
    Value: !Ref IncidentsTable
  HotspotsTableName:
    Value: !Ref HotspotsTable
  ScenarioRunsTableName:
    Value: !Ref ScenarioRunsTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebACLArn:
    Value: !GetAtt ApiWebACL.Arn

