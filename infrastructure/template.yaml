AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HeatFlood Guardian — SAM template with Security & DevOps Enhancements

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures: [arm64]
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        INCIDENTS_TABLE: !Ref IncidentsTable
        HOTSPOTS_TABLE: !Ref HotspotsTable

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  MapboxToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Mapbox Secret Token for Directions API
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: '*'
    Description: Allowed origins for API Gateway CORS configuration
  SageMakerEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable or disable AWS SageMaker ML inference endpoint integration
  SageMakerEndpointName:
    Type: String
    Default: 'heatflood-xgb-v2'
    Description: Name of the active AWS SageMaker inference endpoint

Resources:

  # ------------------------------------------------------------------ #
  # DynamoDB Tables
  # ------------------------------------------------------------------ #

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'heatflood-incidents-${Stage}'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttlEpoch
        Enabled: true
      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S
        - AttributeName: geohash
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: geohash-createdAt-index
          KeySchema:
            - AttributeName: geohash
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  HotspotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'heatflood-hotspots-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hotspotId
          AttributeType: S
      KeySchema:
        - AttributeName: hotspotId
          KeyType: HASH

  # ------------------------------------------------------------------ #
  # Cognito Auth & RBAC
  # ------------------------------------------------------------------ #

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'heatflood-user-pool-${Stage}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'heatflood-client-${Stage}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  ModeratorUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Moderators
      Description: Administrative group for incident moderation and verification
      UserPoolId: !Ref UserPool

  # ------------------------------------------------------------------ #
  # AWS WAF Rate-Limiting Protection
  # ------------------------------------------------------------------ #

  ApiWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'heatflood-webacl-${Stage}'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: HeatFloodWebACL
      Rules:
        - Name: IPBasedRateLimitRule
          Priority: 1
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: IPBasedRateLimitRule
          Statement:
            RateBasedStatement:
              Limit: 300
              AggregateKeyType: IP

  # ------------------------------------------------------------------ #
  # Secrets Manager & Dynamic References
  # ------------------------------------------------------------------ #

  MapboxSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'heatflood/mapbox-token-${Stage}'
      Description: Centralized Mapbox API token with Secrets Manager dynamic rotation
      SecretString: !Sub '{"token":"${MapboxToken}"}'

  # ------------------------------------------------------------------ #
  # Lambda Functions
  # ------------------------------------------------------------------ #

  AnalyseRoutesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-analyseRoutes-${Stage}'
      Handler: analyseRoutes.handler
      CodeUri: ../lambda/dist
      Environment:
        Variables:
          SAGEMAKER_ENABLED: !Ref SageMakerEnabled
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
          MAPBOX_TOKEN: '{{resolve:ssm:/heatflood/mapbox-token}}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HotspotsTable
        - SSMParameterReadPolicy:
            ParameterName: /heatflood/mapbox-token
        - Statement:
            - Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
              Resource: !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /routes/analyse
            Method: POST

  GetStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-getStatus-${Stage}'
      Handler: getStatus.handler
      CodeUri: ../lambda/dist
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HotspotsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /status
            Method: GET

  CreateIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-createIncident-${Stage}'
      Handler: createIncident.handler
      CodeUri: ../lambda/dist
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  ListIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-listIncidents-${Stage}'
      Handler: listIncidents.handler
      CodeUri: ../lambda/dist
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: GET

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-health-${Stage}'
      Handler: health.handler
      CodeUri: ../lambda/dist
      Environment:
        Variables:
          SAGEMAKER_ENABLED: !Ref SageMakerEnabled
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  GetDemoScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'heatflood-getDemoScenario-${Stage}'
      Handler: getDemoScenario.handler
      CodeUri: ../lambda/dist
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /demo/scenarios/{id}
            Method: GET

  # ------------------------------------------------------------------ #
  # API Gateway
  # ------------------------------------------------------------------ #

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub 'heatflood-api-${Stage}'
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Request-Id
          - Authorization
      Auth:
        Authorizers:
          CognitoAuthorizer:
            AuthorizationScopes:
              - openid
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  IncidentsTableName:
    Value: !Ref IncidentsTable
  HotspotsTableName:
    Value: !Ref HotspotsTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebACLArn:
    Value: !GetAtt ApiWebACL.Arn

